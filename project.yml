name: UnitConverter
options:
  bundleIdPrefix: com.rishavjha.larpios
  deploymentTarget:
    iOS: "17.0"

targets:
  UnitConverter:
    type: application
    platform: iOS
    sources:
      - path: UnitConverter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishavjha.larpios.unitconverter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: UnitConverter/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  UnitConverterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitConverterTests
    dependencies:
      - target: UnitConverter
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UnitConverter:
    build:
      targets:
        UnitConverter: all
        UnitConverterTests: [test]
    test:
      targets:
        - UnitConverterTests
